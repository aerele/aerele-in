name: Site build and SEO checks
on:
  pull_request:
  push:
    branches: [gh-pages]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:seo
      - run: test -z "$(git status --porcelain)"
